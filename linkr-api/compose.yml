services:
  postgres:
    image: docker.io/postgres:18.1-alpine
    container_name: linkr-db
    environment:
      POSTGRES_DB: ${DB_NAME:-linkr}
      POSTGRES_USER: ${DB_USER:-linkr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGEME}
    volumes:
      - linkr-data:/var/lib/postgresql/data:Z
    healthcheck:
      test:
        [ "CMD-SHELL", "pg_isready -U ${DB_USER:-linkr} -d ${DB_NAME:-linkr}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  linkr-data: