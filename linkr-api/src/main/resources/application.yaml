spring:
  application:
    name: linkr-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/linkr}
    username: ${DATABASE_USERNAME:linkr}
    password: ${DATABASE_PASSWORD:CHANGEME}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 1

  jackson:
    serialization:
      indent-output: true

  jwt:
    secret: ${JWT_SECRET:"8GEHfJdlzjDCIUtT/ZmeVxjX5DWIHkT11dA5GkMdVTcZOnYOY/0Eta6pfyUIkswFfHuDH1fx7RsoimOL+AUPCDgwOQpHWlj/qzaBG9c+khcvAInBdwGzg+K4SC99ZER2ewUwRYUurl0uuXUTzWAmgCvnGLm4QXtGgR+DTn9DWAj7pAe5zbD1LG1DCiVthoId}
    expiration: 900000