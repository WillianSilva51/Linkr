spring:
  application:
    name: linkr-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/linkr}
    username: ${DATABASE_USERNAME:linkr}
    password: ${DATABASE_PASSWORD:CHANGEME}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 1

  jackson:
    serialization:
      indent-output: true

  security:
    jwt:
      secret: ${JWT_SECRET:CHANGEME}